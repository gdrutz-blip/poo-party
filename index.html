function menuOn(){return !$("game").classList.contains("on")}
function jingleStop(){
  JW=false;clearTimeout(JT);
  if(JA){try{JA.onended=null;JA.pause();JA.currentTime=0}catch(e){}}
  if(JM){try{JM.gain.cancelScheduledValues(0);JM.gain.value=0}catch(e){}JM=null}
}
function jingleStart(){
  if(JW||JDone||muted||!menuOn())return;
  if(JA&&!JA.error){
    JW=true;
    JA.onended=function(){JW=false;JDone=true};
    var pr;try{JA.currentTime=0;pr=JA.play()}catch(e){}
    if(pr&&pr.then)pr.then(function(){JDone=true},function(){JW=false;JDone=false});
    else JDone=true;
    return;
  }
  var a=audio();if(!a||a.state!=="running")return;
  JW=true;
  try{
    var m=a.createGain();m.gain.value=0.08;m.connect(a.destination);JM=m;
    var at=a.currentTime+0.15,total=0;
    TUNE.forEach(function(n){
      var f=n[0],d=n[1];
      if(f){
        var o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
        o.type="sine";o.frequency.value=f;l.frequency.value=6;lg.gain.value=f*0.012;l.connect(lg);lg.connect(o.frequency);
        g.gain.setValueAtTime(0.0001,at);g.gain.linearRampToValueAtTime(1,at+0.04);g.gain.setValueAtTime(1,at+d*0.8);g.gain.linearRampToValueAtTime(0.0001,at+d);
        o.connect(g);g.connect(m);o.start(at);o.stop(at+d+0.02);l.start(at);l.stop(at+d+0.02);
      }
      at+=d;total+=d;
    });
    JDone=true;JT=setTimeout(function(){JW=false},total*1000);
  }catch(e){JW=false}
}
function show(id){
  ["who","home","game","shop","book"].forEach(function(s){$(s).classList.toggle("on",s===id)});

    var open=i<p.hatched;total++;if(open)got++;
    var d=el("div","stk"+(open?"":" off")),cv=mkCanvas();
    drawPoo(cv.getContext("2d"),100,208,140,open?colOf(q):"#cbbfa3",open?accOf(q):"none",0.1,!open);
    d.appendChild(cv);d.appendChild(el("div",null,open?nameOf(q):"???"));g1.appendChild(d);
  });
  body.appendChild(g1);
  body.appendChild(el("h3",null,"Titles"));
  POOS.forEach(function(q){
    if(!TITLES[q.game])return;
    var rk=rankOf(q.game,p.best[q.game]);total+=3;got+=rk;
    var r=el("div","trow");r.appendChild(el("span",null,q.gname));
    r.appendChild(el("span",null,"⭐".repeat(rk)+"☆".repeat(3-rk)));
    body.appendChild(r);
  });
  body.appendChild(el("h3",null,"Special stickers"));
  var g2=el("div","sgrid");
  SPECIALS.forEach(function(sp){
    var ok=sp.ok(p);total++;if(ok)got++;
    var d=el("div","stk"+(ok?"":" off"));d.appendChild(el("div","em",sp.icon));d.appendChild(el("div",null,sp.name));g2.appendChild(d);
  });
  body.appendChild(g2);
  $("bookcount").textContent=got+" / "+total+" stickers";
}

/* ---------- 2-player: take turns on the same game ---------- */
function startVersus(opp){
  versus={kind:sel.game,players:[me,opp],turn:0,scores:[null,null],orig:me,sel:sel,next:null};
  versusReady();
}
function versusReady(){
  me=versus.players[versus.turn];applyOrder(me);
  stop();show("game");
  $("again").style.display="";$("again").textContent="Go!";$("back").textContent="Cancel";
  $("otitle").textContent=me+"'s turn!";$("oscore").textContent="";
  $("opts").textContent="Pass the device to "+me+" ("+(versus.turn+1)+" of 2)";
  $("hatch").textContent="";
  $("over").classList.add("on");
  versus.next=function(){start(versus.kind)};
}
function endVersus(){
  me=versus.orig;applyOrder(me);sel=versus.sel;versus=null;
  $("again").textContent="Play again";$("back").textContent="Back to the party";
  buildHome();show("home");
}

/* ---------- game runner ---------- */
var cv=$("cv"),ctx=cv.getContext("2d"),game=null,raf=0,last=0,running=false;
function fit(){
  var k=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=Math.floor(W*k)+"px";cv.style.height=Math.floor(H*k)+"px";
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  if(game)game.draw(ctx);
}
window.addEventListener("resize",fit);
function px(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width}
function py(e){var r=cv.getBoundingClientRect();return (e.clientY-r.top)*H/r.height}
var GAMES={catch:CatchGame,flap:FlapGame,whack:WhackGame,run:RunGame,dress:DressGame,disco:DiscoGame,hop:HopGame,match:MatchGame,care:CareGame,hatch:HatchGame,says:SaysGame,tower:TowerGame,bounce:BounceGame,pairs:PairsGame,slice:SliceGame,race:RaceGame,beat:function(){return BeatGame("pop","beat",3,230,300,"swoop shades")},spot:SpotGame,bricks:BricksGame,pipes:PipesGame,duel:DuelGame,path:PathGame,juggle:JuggleGame,blast:BlastGame,kitchen:KitchenGame,pizza:PizzaGame,clinic:ClinicGame,grill:GrillGame,trail:TrailGame,teeth:TeethGame,pinball:PinballGame,drop:DropGame,cookies:CookieGame,shoot:ShootGame,meteor:MeteorGame};
cv.addEventListener("pointerdown",function(e){e.preventDefault();audio();lastTap={x:px(e),y:py(e),ts:Date.now()};if(game&&running)game.tap(px(e),py(e))});
cv.addEventListener("pointerup",function(e){if(game&&running&&game.up)game.up(px(e),py(e))});
cv.addEventListener("pointermove",function(e){if(game&&running){if(e.buttons)lastTap={x:px(e),y:py(e),ts:Date.now()};game.pointer(px(e),py(e))}});
window.addEventListener("keydown",function(e){
  if(!game||!running)return;
  if(game.key){if(game.key(e.code))e.preventDefault();return}
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();game.tap(W/2)}
});

var gspeed=1;
function start(kind){
  FX=[];
  game=(GAMES[kind]||CatchGame)();
  gspeed=(me==="Daddy"&&prof().expert&&!versus&&TITLES[game.name])?2:1;
  $("over").classList.remove("on");show("game");fit();
  running=true;last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function loop(ts){
  if(!running)return;
  var dt=last?Math.min(0.033,(ts-last)/1000):0;last=ts;
  var res=game.update(dt);
  if(!res&&gspeed>1)res=game.update(dt);
  game.draw(ctx);fxStep(dt);fxDraw(ctx);
  if(gspeed>1){ctx.font="800 16px 'Baloo 2',sans-serif";ctx.textAlign="right";ctx.fillStyle="#ff5fa2";ctx.fillText("⚡ 2x",W-10,H-8)}
  if(res){finish(res);return}
  raf=requestAnimationFrame(loop);
}
function stop(){running=false;cancelAnimationFrame(raf)}
function finish(res){
  stop();setTimeout(fart,200);
  var p=prof();
  if(!versus){$("again").textContent="Play again";$("back").textContent="Back to the party"}
  $("again").style.display=(res.hatchPoo||res.careId||res.golden)?"none":"";
  if(res.golden){
    p.golden=Math.max(0,(p.golden||0)-1);p.goldHatched=(p.goldHatched||0)+1;
    if(res.prize){p.hats.push(res.prize);p.wear[sel.id]=res.prize}else{p.pts+=25;addMeter(p,25)}
    save();
    $("otitle").textContent=res.title;$("oscore").textContent="✨";
    $("opts").textContent=res.prize?"Wearing it now! Change hats in the Hat Shop.":"+25 ⭐ party points";$("hatch").textContent=(!res.prize&&eggReady(p))?"🥚 Your egg is ready to hatch!":"";
    $("over").classList.add("on");
    return;
  }
  if(res.hatchPoo){
    var egg=POOS[p.hatched];p.hatched+=1;p.meter=0;sel=egg;
    careOf(egg.id).next=Date.now()+90000+Math.random()*90000;
    save();
    $("otitle").textContent=res.title;$("oscore").textContent="";
    $("opts").textContent="";$("hatch").textContent="";
    $("over").classList.add("on");
    return;
  }
  if(res.careId){var cr=p.care[res.careId];if(cr){cr.need=null;cr.next=Date.now()+300000+Math.random()*300000}p.cared=(p.cared||0)+1}
  p.pts+=res.pts;
  var newBest=res.score!=null&&res.score>(p.best[game.name]||0);
  var rank0=rankOf(game.name,p.best[game.name]);
  if(newBest)p.best[game.name]=res.score;
  var rank1=rankOf(game.name,p.best[game.name]);
  var goldMsg=false;
  if(rank1>=3&&rank0<3){p.golden=(p.golden||0)+1;goldMsg=true}
  /* party points fill the egg; a full egg waits to be tapped, so only one poo hatches at a time */
  var ready=false,next=POOS[p.hatched];
  if(next){var before=p.meter;p.meter=Math.min(next.cost,p.meter+res.pts);if(before<next.cost&&p.meter>=next.cost)ready=true}
  save();
  $("otitle").textContent=res.title||(rank1>rank0?"New title: "+RANKS[rank1]+"!":newBest&&res.score>0?"New best score!":"Party pooper!");
  $("oscore").textContent=res.score==null?"":res.score;
  $("opts").textContent="You earned ⭐ "+res.pts+" party points";
  $("hatch").textContent=(ready?"🥚 Your egg is ready to hatch!":"")+(goldMsg?(ready?"\n":"")+"✨ A GOLDEN EGG appeared!":"");
  if(ready||goldMsg||rank1>rank0)tada();
  if(versus&&res.score!=null){
    versus.scores[versus.turn]=res.score;
    $("otitle").textContent=me+" scored "+res.score+"!";
    if(versus.turn===0){
      $("again").textContent="Next: "+versus.players[1]+"'s turn";$("again").style.display="";$("back").textContent="Cancel";
      versus.next=function(){versus.turn=1;versusReady()};
    }else{
      var a=versus.scores[0],b=versus.scores[1],msg;
      if(a===b)msg="It's a tie! "+a+" - "+b;
      else{
        var wi=a>b?0:1,w=versus.players[wi],wp=store.profiles[w];
        wp.pts+=5;addMeter(wp,5);wp.wins=(wp.wins||0)+1;save();
        msg=w+" wins! "+versus.scores[wi]+" - "+versus.scores[1-wi];
      }
      $("otitle").textContent=msg;$("oscore").textContent="🏆";
      $("again").textContent="Rematch";$("again").style.display="";$("back").textContent="Back to the party";
      versus.next=function(){versus.turn=0;versus.scores=[null,null];versusReady()};
      tada();
    }
  }
  $("over").classList.add("on");
}

$("play2").addEventListener("click",function(){audio();if(sel.game2)start(sel.game2)});
$("golden").addEventListener("click",function(){audio();pendingGolden=true;start("hatch")});

$("bookback").addEventListener("click",function(){buildHome();show("home")});
$("renamebtn").addEventListener("click",function(){
  $("rinput").value=nameOf(sel);$("rename").classList.add("on");

});

$("vs").addEventListener("click",function(){

  var box=$("vsbtns");box.innerHTML="";
  opps.forEach(function(n){

    b.addEventListener("click",function(){$("vsbox").classList.remove("on");startVersus(n)});
    box.appendChild(b);
  });
  $("vsbox").classList.add("on");
});
$("vscancel").addEventListener("click",function(){$("vsbox").classList.remove("on")});
$("care").addEventListener("click",function(){audio();start("care")});
$("disco").addEventListener("click",function(){audio();start("disco")});
$("again").addEventListener("click",function(){if(versus){versus.next();return}start(game.name)});
$("back").addEventListener("click",function(){if(versus){endVersus();return}buildHome();show("home")});
$("quit").addEventListener("click",function(){stop();if(versus){endVersus();return}buildHome();show("home")});
$("switch").addEventListener("click",function(){buildWho();show("who")});
$("mute").addEventListener("click",function(){muted=!muted;this.textContent="Sound: "+(muted?"off":"on");if(muted)jingleStop();else fart()});

/* grown-up reset: hold the button for 3 seconds to wipe the current player's progress */
var resetBtn=$("reset"),holdT=0,labelT=0;
function resetLabel(txt){clearTimeout(labelT);resetBtn.textContent=txt;
  if(txt!=="Start over"&&txt!=="Keep holding...")labelT=setTimeout(function(){resetBtn.textContent="Start over"},1600)}
resetBtn.addEventListener("pointerdown",function(e){
  if(e&&e.preventDefault)e.preventDefault();
  resetLabel("Keep holding...");
  clearTimeout(holdT);
  holdT=setTimeout(function(){
    holdT=0;var p=prof();
    p.pts=0;p.best={};p.hatched=1;p.meter=0;p.care={};p.spent=0;p.hats=[];p.wear={};p.names={};p.golden=0;p.goldHatched=0;p.cared=0;p.wins=0;p.order=null;p.gear={};p.room="";p.outfit={hat:0,eyes:0,extra:0,color:0};applyOrder(me);
    save();sel=POOS[0];buildHome();bleh();resetLabel(me+" starts fresh!");
  },3000);
});
["pointerup","pointerleave","pointercancel"].forEach(function(ev){
  resetBtn.addEventListener(ev,function(){if(holdT){clearTimeout(holdT);holdT=0;resetLabel("Hold for 3 seconds")}});
});
resetBtn.addEventListener("contextmenu",function(e){e.preventDefault()});

setInterval(function(){
  try{if(me&&$("home").classList.contains("on")&&tickCare())buildHome()}catch(e){}
},15000);

document.addEventListener("pointerdown",function(e){
  var b=e.target.closest&&e.target.closest("button,.btn");
  if(b&&!(typeof JW!=="undefined"&&JW)&&Math.random()<0.35)fart();
});
buildWho();
})();
