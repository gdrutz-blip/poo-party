<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Poo Party</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff4d6; --ink:#3b2412; --brown:#8a5a2b; --pink:#ff5fa2; --teal:#19b5a5;
    --purple:#8b5cf6; --yellow:#ffc93c; --card:#fffdf7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
    color:var(--ink);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;
    background-image:
      radial-gradient(circle at 12% 18%,#ff5fa233 0 10px,transparent 11px),
      radial-gradient(circle at 82% 12%,#19b5a533 0 14px,transparent 15px),
      radial-gradient(circle at 70% 78%,#8b5cf633 0 12px,transparent 13px),
      radial-gradient(circle at 22% 84%,#ffc93c55 0 16px,transparent 17px),
      radial-gradient(circle at 48% 46%,#ff5fa222 0 8px,transparent 9px);
  }
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:18px 16px;overflow-y:auto}
  .screen.on{display:flex}
  h1{font-size:44px;line-height:1;margin:10px 0 0;font-weight:800;text-align:center;color:var(--brown);
     text-shadow:3px 3px 0 var(--yellow)}
  h2{font-size:26px;margin:14px 0 8px;font-weight:700;text-align:center}
  p{margin:4px 0;font-size:18px;text-align:center}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .btn{background:var(--pink);color:#fff;font-weight:800;font-size:22px;padding:12px 26px;border-radius:999px;
       box-shadow:0 5px 0 #c93a78;transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c93a78}
  .btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 #e3d3ad}
  .btn.small{font-size:16px;padding:7px 16px;box-shadow:0 3px 0 #e3d3ad}

  /* who's playing */
  #who .players{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap;justify-content:center}
  .player{width:140px;padding:14px 10px 16px;border-radius:26px;background:var(--card);
          box-shadow:0 7px 0 #e3d3ad;display:flex;flex-direction:column;align-items:center;transition:transform .08s}
  .player:active{transform:translateY(5px);box-shadow:0 2px 0 #e3d3ad}
  .player b{font-size:30px;font-weight:800}
  .player span{font-size:16px;opacity:.75}
  .player.farah b{color:var(--purple)} .player.mia b{color:var(--teal)} .player.gemma b{color:var(--pink)}

  /* home */
  .top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chip{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #e3d3ad}
  .bar{width:100%;max-width:520px;height:22px;background:#fff;border-radius:999px;overflow:hidden;margin-top:6px;
       box-shadow:inset 0 0 0 3px var(--ink)}
  .bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--yellow) 0 12px,#ffb31c 12px 24px);
         width:0;transition:width .6s}
  .room{width:100%;max-width:520px;margin-top:14px;background:var(--card);border-radius:28px;padding:16px 8px 10px;
        display:flex;flex-wrap:wrap;row-gap:10px;justify-content:space-around;align-items:flex-end;box-shadow:0 7px 0 #e3d3ad}
  .poo{background:none;padding:0;display:flex;flex-direction:column;align-items:center;width:32%}
  .poo canvas{width:86px;height:95px;animation:bob 1.6s ease-in-out infinite}
  .poo:nth-child(2) canvas{animation-delay:-.5s} .poo:nth-child(3) canvas{animation-delay:-1s}
  .poo.sel canvas{filter:drop-shadow(0 0 10px var(--yellow))}
  .poo.wig canvas{animation:wig .45s}
  .poo small{font-size:15px;font-weight:700;line-height:1.15;text-align:center;min-height:36px;white-space:pre-line}
  #ctitle{font-size:16px;color:var(--purple);font-weight:700}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px) scale(1.03,.97)}}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
  .card{width:100%;max-width:520px;margin-top:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
  .card h2{margin:0}
  .foot{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
  #reset{touch-action:none}

  /* game */
  #game{padding:0;background:#222;justify-content:center;overflow:hidden}
  #cv{touch-action:none;display:block;background:#bfe9ff;border-radius:14px}
  #quit{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:#fff;font-size:22px;font-weight:800;z-index:2}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
        background:#fff4d6ee;padding:20px;z-index:3}
  #over.on{display:flex}
  #over .big{font-size:60px;font-weight:800;color:var(--pink);line-height:1}
  #hatch{font-size:22px;font-weight:800;color:var(--purple);min-height:0}
</style>
</head>
<body>

<section id="who" class="screen on">
  <h1>Poo Party</h1>
  <h2>Who's playing?</h2>
  <div class="players" id="players"></div>
</section>

<section id="home" class="screen">
  <div class="top">
    <span class="chip" id="hello"></span>
    <span class="chip" id="pts"></span>
  </div>
  <div class="bar"><i id="barfill"></i></div>
  <p id="next"></p>
  <div class="room" id="room"></div>
  <div class="card">
    <h2 id="cname"></h2>
    <p id="cblurb"></p>
    <p id="cbest"></p>
    <p id="ctitle"></p>
    <button class="btn" id="play"></button>
    <button class="btn alt" id="disco" style="display:none">🪩 Poo Disco!</button>
  </div>
  <div class="foot">
    <button class="btn alt small" id="switch">Switch player</button>
    <button class="btn alt small" id="mute">Sound: on</button>
    <button class="btn alt small" id="reset">Start over</button>
  </div>
</section>

<section id="game" class="screen">
  <button id="quit" aria-label="Quit game">✕</button>
  <canvas id="cv" width="360" height="600"></canvas>
  <div id="over">
    <h2 id="otitle"></h2>
    <div class="big" id="oscore"></div>
    <p id="opts"></p>
    <div id="hatch"></div>
    <button class="btn" id="again">Play again</button>
    <button class="btn alt" id="back">Back to the party</button>
  </div>
</section>

<script>
(function(){
"use strict";
var W=360,H=600;
var $=function(id){return document.getElementById(id)};

/* ---------- saved progress (one slot per kid, on this device) ---------- */
var KEY="pooParty.v1";
var NAMES=["Farah","Mia","Gemma"];
var PCOL={Farah:"#8b5cf6",Mia:"#19b5a5",Gemma:"#ff5fa2"};
var store={profiles:{}};
var OLD_NEED=[0,25,60,110];
NAMES.forEach(function(n){store.profiles[n]={pts:0,best:{},hatched:1,meter:0,outfit:{hat:0,eyes:0,extra:0,color:0}}});
try{
  var s=JSON.parse(localStorage.getItem(KEY));
  if(s&&s.profiles)NAMES.forEach(function(n){
    var o=s.profiles[n],p=store.profiles[n];if(!o)return;
    p.pts=o.pts||0;p.best=o.best||{};
    if(o.hatched){p.hatched=o.hatched;p.meter=o.meter||0}
    else{p.hatched=OLD_NEED.filter(function(v){return p.pts>=v}).length}
    if(o.outfit)["hat","eyes","extra","color"].forEach(function(k){p.outfit[k]=o.outfit[k]||0});
  });
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

/* ---------- the poos ---------- */
var POOS=[
  {id:"plops",name:"Sir Plops-a-Lot",color:"#8a5a2b",acc:"hat",cost:0,game:"catch",gname:"Poo Catcher",
   blurb:"Slide the toilet to catch the poos. Dodge the broccoli!"},
  {id:"flappy",name:"Flappy McPlop",color:"#b5763a",acc:"wings",cost:30,game:"flap",gname:"Flappy Poo",
   blurb:"Tap to flap between the toilet paper towers!"},
  {id:"peeky",name:"Peeky Poo",color:"#a0672f",acc:"bow",cost:50,game:"whack",gname:"Whack-a-Poo",
   blurb:"Bop the poos when they peek out. Don't bop the duck!"},
  {id:"skater",name:"Skater Poo",color:"#7a4a22",acc:"shades",cost:70,game:"run",gname:"Poo Runner",
   blurb:"Tap to jump the plungers and grab the toilet paper!"},
  {id:"fancy",name:"Fancy Poo",color:"#8a5a2b",acc:"crown",cost:90,game:"dress",gname:"Dress-Up",
   blurb:"Dress up your poo, then throw it a party!"}
];
var HATS=["none","hat","party","crown","bow"],HATN=["No hat","Top hat","Party hat","Crown","Bow"];
var EYES=["none","shades","round"],EYEN=["No glasses","Cool shades","Round glasses"];
var EXTRAS=["none","stache","wings","gold"],EXN=["Nothing extra","Moustache","Wings","Sparkles"];
var COLORS=["#8a5a2b","#f5b800","#ff7eb6","#19b5a5","#8b5cf6"],COLN=["Classic brown","Golden","Pink","Teal","Purple"];
function has(a,k){return (" "+a+" ").indexOf(" "+k+" ")>=0}
function outfitAcc(o){return HATS[o.hat]+" "+EYES[o.eyes]+" "+EXTRAS[o.extra]}
function accOf(q){return q.id==="fancy"?outfitAcc(prof().outfit):q.acc}
function colOf(q){return q.id==="fancy"?COLORS[prof().outfit.color]:q.color}
function noop(){}
/* score needed in each game for each title */
var TITLES={"catch":[30,80,200],flap:[5,15,40],whack:[8,15,25],run:[10,30,50]};
var RANKS=["","Little Stinker","Super Pooper","Poo Master"];
function rankOf(g,best){var a=TITLES[g];if(!a)return 0;return a.filter(function(v){return (best||0)>=v}).length}
var me=null, sel=POOS[0];
function prof(){return store.profiles[me]}
function unlocked(q){return POOS.indexOf(q)<prof().hatched}

/* ---------- sounds ---------- */
var ac=null,muted=false;
function audio(){
  if(muted)return null;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
  catch(e){return null}
}
function tone(type,f1,f2,dur,vol,wobble){
  var a=audio();if(!a)return;
  try{
    var n=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur);
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(0.001,n+dur);
    o.connect(g);g.connect(a.destination);
    if(wobble){var l=a.createOscillator(),lg=a.createGain();l.frequency.value=wobble;lg.gain.value=f1*0.3;
      l.connect(lg);lg.connect(o.frequency);l.start(n);l.stop(n+dur)}
    o.start(n);o.stop(n+dur+0.02);
  }catch(e){}
}
function fart(){var f=65+Math.random()*60;tone("sawtooth",f,f*0.5,0.22+Math.random()*0.2,0.22,24+Math.random()*14)}
function ding(){tone("sine",880,1500,0.25,0.2)}
function bleh(){tone("square",220,80,0.35,0.12)}
function flapSnd(){tone("sawtooth",150,90,0.09,0.12,40)}
function tada(){tone("triangle",523,523,0.15,0.2);setTimeout(function(){tone("triangle",659,659,0.15,0.2)},140);
  setTimeout(function(){tone("triangle",784,1046,0.4,0.2)},280)}

/* ---------- drawing ---------- */
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
function shade(hex,k){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return "rgb("+Math.round(r*k)+","+Math.round(g*k)+","+Math.round(b*k)+")";
}
/* poo standing on (x,y), about s wide and s tall */
function drawPoo(c,x,y,s,color,acc,t,noFace){
  t=t||0;
  if(has(acc,"wings")){
    var fl=Math.sin(t*14)*0.25;
    c.fillStyle="#fff";c.strokeStyle="#9ad";c.lineWidth=2;
    [-1,1].forEach(function(d){
      c.save();c.translate(x+d*0.38*s,y-0.5*s);c.rotate(d*(-0.5+fl));
      c.beginPath();c.ellipse(d*0.2*s,0,0.26*s,0.12*s,0,0,Math.PI*2);c.fill();c.stroke();c.restore();
    });
  }
  c.fillStyle=shade(color,0.8);
  ell(c,x,y-0.16*s,0.5*s,0.19*s);
  c.fillStyle=color;
  ell(c,x,y-0.2*s,0.48*s,0.17*s);
  c.fillStyle=shade(color,0.8);ell(c,x,y-0.42*s,0.37*s,0.17*s);
  c.fillStyle=color;ell(c,x,y-0.46*s,0.36*s,0.15*s);
  c.fillStyle=shade(color,0.8);ell(c,x,y-0.65*s,0.24*s,0.14*s);
  c.fillStyle=color;ell(c,x,y-0.68*s,0.23*s,0.12*s);
  ell(c,x+0.05*s,y-0.82*s,0.09*s,0.09*s);
  if(!noFace){
    c.fillStyle="#fff";ell(c,x-0.13*s,y-0.46*s,0.08*s,0.09*s);ell(c,x+0.13*s,y-0.46*s,0.08*s,0.09*s);
    c.fillStyle="#222";ell(c,x-0.12*s,y-0.45*s,0.04*s,0.05*s);ell(c,x+0.14*s,y-0.45*s,0.04*s,0.05*s);
    c.strokeStyle="#3b2412";c.lineWidth=Math.max(2,0.04*s);c.lineCap="round";
    c.beginPath();c.arc(x,y-0.26*s,0.13*s,0.15*Math.PI,0.85*Math.PI);c.stroke();
  }else{
    c.fillStyle="#fff";c.font="800 "+Math.round(0.4*s)+"px 'Baloo 2',sans-serif";c.textAlign="center";
    c.fillText("?",x,y-0.28*s);
  }
  if(has(acc,"hat")){
    c.fillStyle="#222";c.fillRect(x-0.2*s,y-0.92*s,0.4*s,0.05*s);c.fillRect(x-0.13*s,y-1.18*s,0.26*s,0.28*s);
    c.fillStyle="#ff5fa2";c.fillRect(x-0.13*s,y-0.99*s,0.26*s,0.05*s);
  }
  if(has(acc,"bow")&&!noFace){
    c.fillStyle="#ff5fa2";
    c.beginPath();c.moveTo(x,y-0.86*s);c.lineTo(x-0.2*s,y-0.98*s);c.lineTo(x-0.2*s,y-0.74*s);c.closePath();c.fill();
    c.beginPath();c.moveTo(x,y-0.86*s);c.lineTo(x+0.2*s,y-0.98*s);c.lineTo(x+0.2*s,y-0.74*s);c.closePath();c.fill();
    ell(c,x,y-0.86*s,0.05*s,0.05*s);
  }
  if(has(acc,"shades")&&!noFace){
    c.fillStyle="#111";c.fillRect(x-0.24*s,y-0.53*s,0.2*s,0.13*s);c.fillRect(x+0.04*s,y-0.53*s,0.2*s,0.13*s);
    c.fillRect(x-0.26*s,y-0.52*s,0.52*s,0.035*s);
  }
  if(has(acc,"party")&&!noFace){
    c.fillStyle="#19b5a5";c.beginPath();c.moveTo(x-0.16*s,y-0.88*s);c.lineTo(x+0.18*s,y-0.88*s);c.lineTo(x+0.03*s,y-1.28*s);c.closePath();c.fill();
    c.fillStyle="#ffc93c";ell(c,x+0.03*s,y-1.28*s,0.05*s,0.05*s);ell(c,x-0.04*s,y-0.98*s,0.03*s,0.03*s);ell(c,x+0.08*s,y-1.06*s,0.03*s,0.03*s);
  }
  if(has(acc,"crown")&&!noFace){
    c.fillStyle="#ffc93c";c.beginPath();c.moveTo(x-0.18*s,y-0.88*s);c.lineTo(x-0.2*s,y-1.1*s);c.lineTo(x-0.09*s,y-0.99*s);
    c.lineTo(x+0.01*s,y-1.14*s);c.lineTo(x+0.11*s,y-0.99*s);c.lineTo(x+0.22*s,y-1.1*s);c.lineTo(x+0.2*s,y-0.88*s);c.closePath();c.fill();
    c.fillStyle="#ff5fa2";ell(c,x+0.01*s,y-0.94*s,0.03*s,0.03*s);
  }
  if(has(acc,"round")&&!noFace){
    c.strokeStyle="#222";c.lineWidth=Math.max(2,0.03*s);
    c.beginPath();c.arc(x-0.13*s,y-0.46*s,0.11*s,0,Math.PI*2);c.stroke();
    c.beginPath();c.arc(x+0.13*s,y-0.46*s,0.11*s,0,Math.PI*2);c.stroke();
  }
  if(has(acc,"stache")&&!noFace){
    c.fillStyle="#2b1a0c";
    [-1,1].forEach(function(d){c.save();c.translate(x+d*0.1*s,y-0.33*s);c.rotate(d*-0.25);ell(c,0,0,0.12*s,0.045*s);c.restore()});
  }
  if(has(acc,"gold")){
    c.fillStyle="#fff";
    [[-0.3,-0.75],[0.34,-0.55],[-0.38,-0.3]].forEach(function(p){
      var r=0.05*s*(1+0.4*Math.sin(t*8+p[0]*9));ell(c,x+p[0]*s,y+p[1]*s,r,r);
    });
  }
}
function drawBroccoli(c,x,y,s){
  c.fillStyle="#9bcf6a";c.fillRect(x-0.1*s,y-0.1*s,0.2*s,0.5*s);
  c.fillStyle="#2f9e44";
  [[-0.25,-0.1],[0.25,-0.1],[0,-0.3],[-0.14,-0.28],[0.14,-0.28]].forEach(function(p){ell(c,x+p[0]*s,y+p[1]*s,0.2*s,0.2*s)});
  c.fillStyle="#222";ell(c,x-0.1*s,y-0.15*s,0.035*s,0.045*s);ell(c,x+0.1*s,y-0.15*s,0.035*s,0.045*s);
  c.strokeStyle="#222";c.lineWidth=2;c.beginPath();c.arc(x,y+0.02*s,0.08*s,1.15*Math.PI,1.85*Math.PI);c.stroke();
}
function drawDuck(c,x,y,s){
  c.fillStyle="#ffd43b";ell(c,x,y-0.25*s,0.42*s,0.27*s);ell(c,x+0.12*s,y-0.62*s,0.24*s,0.23*s);
  c.fillStyle="#ff922b";ell(c,x+0.38*s,y-0.58*s,0.13*s,0.07*s);
  c.fillStyle="#222";ell(c,x+0.18*s,y-0.67*s,0.04*s,0.045*s);
}
function drawPlunger(c,x,y){
  c.fillStyle="#b08050";c.fillRect(x-3,y-52,6,36);
  c.fillStyle="#e03131";c.beginPath();c.moveTo(x-16,y);c.quadraticCurveTo(x-14,y-20,x,y-20);
  c.quadraticCurveTo(x+14,y-20,x+16,y);c.closePath();c.fill();
}
function drawRoll(c,x,y){
  c.fillStyle="#fff";ell(c,x,y,15,15);c.strokeStyle="#aab4c4";c.lineWidth=2;c.beginPath();c.arc(x,y,15,0,Math.PI*2);c.stroke();
  c.fillStyle="#cfd8e3";ell(c,x,y,5,5);
}
function drawToilet(c,x,y){
  c.fillStyle="#e9eef5";c.beginPath();c.moveTo(x-44,y);c.quadraticCurveTo(x-40,y+52,x-14,y+56);
  c.lineTo(x+14,y+56);c.quadraticCurveTo(x+40,y+52,x+44,y);c.fill();
  c.fillStyle="#cfd8e3";c.fillRect(x-20,y+54,40,14);
  c.fillStyle="#fff";ell(c,x,y,50,14);
  c.fillStyle="#6cc5f0";ell(c,x,y+1,38,8);
}
function hud(c,text,lives){
  c.font="800 26px 'Baloo 2',sans-serif";c.textAlign="left";c.lineWidth=5;c.strokeStyle="#fff";c.fillStyle="#3b2412";
  c.strokeText(text,14,36);c.fillText(text,14,36);
  if(lives!=null){c.font="24px sans-serif";c.fillText("❤️".repeat(Math.max(0,lives)),14,66)}
}
function banner(c,text){
  c.font="800 26px 'Baloo 2',sans-serif";c.textAlign="center";c.lineWidth=6;c.strokeStyle="#fff";c.fillStyle="#ff5fa2";
  c.strokeText(text,W/2,H/2-60);c.fillText(text,W/2,H/2-60);
}

/* ---------- game 1: Poo Catcher ---------- */
function CatchGame(){
  var tx=W/2,items=[],score=0,lives=3,t=0,spawn=0.6,pops=[];
  var TY=H-92;
  return {
    name:"catch",
    pointer:function(x){tx=Math.max(48,Math.min(W-48,x))},
    tap:function(x){this.pointer(x)},
    update:function(dt){
      t+=dt;spawn-=dt;
      if(spawn<=0){
        var r=Math.random();
        items.push({x:34+Math.random()*(W-68),y:-30,type:r<0.2?"broc":r<0.3?"gold":"poo",
                    vy:105+Math.min(t*3.5,170)+Math.random()*40});
        spawn=Math.max(0.42,1-t*0.012);
      }

/* ---------- game 2: Flappy Poo ---------- */
function FlapGame(){
  var y=H/2,vy=0,started=false,pipes=[],score=0,t=0,dist=0;
  var BX=90,PW=60,GROUND=H-34,made=0;
  function speed(){return 78+Math.min(17,score*1.5)}
  function addPipe(x){var gap=Math.max(215,265-made*6);made+=1;
    pipes.push({x:x,gap:gap,gy:110+Math.random()*(GROUND-gap-190),done:false})}
  addPipe(W+110);addPipe(W+110+225);
  function tower(c,x,top,bottom){
    c.fillStyle="#fff";c.fillRect(x,top,PW,bottom-top);
    c.strokeStyle="#d5dbe6";c.lineWidth=2;
    for(var yy=top+26;yy<bottom;yy+=26){c.beginPath();c.moveTo(x,yy);c.lineTo(x+PW,yy);c.stroke()}
    c.strokeStyle="#aab4c4";c.strokeRect(x,top,PW,bottom-top);
  }
  return {
    name:"flap",
    pointer:function(){},
    tap:function(){started=true;vy=-255;flapSnd()},
    update:function(dt){
      t+=dt;
      if(!started){y=H/2+Math.sin(t*3)*10;return null}
      vy+=600*dt;y+=vy*dt;if(y<24){y=24;vy=0}
      dist+=speed()*dt;
      for(var i=pipes.length-1;i>=0;i--){
        var p=pipes[i];p.x-=speed()*dt;
        if(!p.done&&p.x+PW<BX-16){p.done=true;score+=1;ding()}
        if(p.x<-PW-10){pipes.splice(i,1);addPipe(pipes[pipes.length-1].x+225)}
      }
      var hit=y+16>GROUND;
      pipes.forEach(function(p){
        if(BX+15>p.x&&BX-15<p.x+PW&&(y-16<p.gy||y+16>p.gy+p.gap))hit=true;
      });
      if(hit){bleh();return {score:score,pts:score*2}}
      return null;
    },
    draw:function(c){
      c.fillStyle="#bfe9ff";c.fillRect(0,0,W,H);
      c.fillStyle="#fff";
      [[60,90],[230,150],[150,300]].forEach(function(cl){
        var cx=((cl[0]-dist*0.25)%(W+120)+W+120)%(W+120)-60;
        ell(c,cx,cl[1],34,16);ell(c,cx+24,cl[1]-10,24,16);ell(c,cx-22,cl[1]-6,20,13);
      });
      pipes.forEach(function(p){tower(c,p.x,-4,p.gy);tower(c,p.x,p.gy+p.gap,GROUND)});
      c.fillStyle="#9bd36b";c.fillRect(0,GROUND,W,H-GROUND);
      c.fillStyle="#7dbb4e";c.fillRect(0,GROUND,W,6);
      c.save();c.translate(BX,y+18);c.rotate(Math.max(-0.4,Math.min(0.6,vy/500)));
      drawPoo(c,0,0,40,"#b5763a","wings",t);c.restore();
      hud(c,"Towers: "+score,null);
      if(!started)banner(c,"Tap to flap!");
    }
  };
}

/* ---------- game 3: Whack-a-Poo ---------- */
function WhackGame(){
  var holes=[],score=0,left=30,t=0,spawn=0.5,pops=[];
  [210,350,490].forEach(function(hy){[70,180,290].forEach(function(hx){holes.push({x:hx,y:hy,type:null,t:0,dur:1})})});
  return {
    name:"whack",
    pointer:function(){},
    tap:function(x,y){
      for(var i=0;i<holes.length;i++){
        var h=holes[i];if(!h.type)continue;
        if(Math.abs(x-h.x)<52&&y>h.y-80&&y<h.y+30){
          if(h.type==="poo"){score+=1;fart();pops.push({x:h.x,y:h.y-50,txt:"+1",a:1})}
          else if(h.type==="gold"){score+=3;ding();pops.push({x:h.x,y:h.y-50,txt:"+3!",a:1})}
          else{score=Math.max(0,score-2);bleh();pops.push({x:h.x,y:h.y-50,txt:"QUACK!",a:1})}
          h.type=null;return;
        }
      }
    },
    update:function(dt){
      t+=dt;left-=dt;spawn-=dt;
      if(spawn<=0){
        var free=holes.filter(function(h){return !h.type});
        if(free.length){
          var h=free[Math.floor(Math.random()*free.length)],r=Math.random();
          h.type=r<0.18?"duck":r<0.28?"gold":"poo";h.t=0;h.dur=Math.max(0.95,1.6-t*0.02);
        }
        spawn=Math.max(0.4,0.85-t*0.012);
      }
      holes.forEach(function(h){if(h.type){h.t+=dt;if(h.t>=h.dur)h.type=null}});
      for(var j=pops.length-1;j>=0;j--){pops[j].y-=50*dt;pops[j].a-=1.4*dt;if(pops[j].a<=0)pops.splice(j,1)}
      if(left<=0)return {score:score,pts:score};
      return null;
    },
    draw:function(c){
      c.fillStyle="#ffe3ef";c.fillRect(0,0,W,H);
      c.fillStyle="#ffd0e2";for(var gy=0;gy<H;gy+=60)for(var gx=(gy/60%2)*60;gx<W;gx+=120)c.fillRect(gx,gy,60,60);
      holes.forEach(function(h){
        drawToilet(c,h.x,h.y);
        if(h.type){
          var k=Math.min(1,h.t/0.14,(h.dur-h.t)/0.14);
          c.save();c.beginPath();c.rect(h.x-60,h.y-130,120,133);c.clip();
          var py=h.y+62-k*58;
          if(h.type==="duck")drawDuck(c,h.x,py,56);
          else drawPoo(c,h.x,py,h.type==="gold"?58:54,h.type==="gold"?"#f5b800":"#a0672f",h.type==="gold"?"gold":"bow",t);
          c.restore();
        }
      });
      c.font="800 24px 'Baloo 2',sans-serif";c.textAlign="center";
      pops.forEach(function(p){c.globalAlpha=Math.max(0,p.a);c.fillStyle=p.txt==="QUACK!"?"#f08c00":"#ff5fa2";c.fillText(p.txt,p.x,p.y)});
      c.globalAlpha=1;
      hud(c,"Poos: "+score,null);
      c.fillStyle="#fff";c.fillRect(14,50,200,14);c.fillStyle="#ff5fa2";c.fillRect(14,50,200*Math.max(0,left)/30,14);
      c.strokeStyle="#3b2412";c.lineWidth=2;c.strokeRect(14,50,200,14);
      if(t<2.5)banner(c,"Bop the poos!");
    }
  };
}

/* ---------- game 4: Poo Runner ---------- */
function RunGame(){
  var G=H-120,BX=80,y=G,vy=0,t=0,score=0,lives=3,safe=0,things=[],nextAt=1.2,dist=0,pops=[];
  return {
    name:"run",
    pointer:function(){},
    tap:function(){if(y>=G-1){vy=-450;flapSnd()}},
    update:function(dt){
      t+=dt;safe-=dt;
      var sp=150+Math.min(t*3,120);dist+=sp*dt;
      vy+=1150*dt;y+=vy*dt;if(y>G){y=G;vy=0}
      nextAt-=dt;
      if(nextAt<=0){
        var r=Math.random();
        if(r<0.5)things.push({x:W+30,kind:"plunger",done:false});
        else if(r<0.75)things.push({x:W+30,kind:"roll",ry:G-22});
        else things.push({x:W+30,kind:"roll",ry:G-95});
        nextAt=1.05+Math.random()*0.9;
      }
      for(var i=things.length-1;i>=0;i--){
        var o=things[i];o.x-=sp*dt;
        if(o.kind==="plunger"){
          if(safe<=0&&Math.abs(o.x-BX)<24&&y>G-34){lives-=1;safe=1.2;bleh();pops.push({x:BX,y:y-60,txt:"OUCH!",a:1})}
          if(!o.done&&o.x<BX-30){o.done=true;if(safe<=0.2){score+=1;pops.push({x:BX,y:y-60,txt:"+1",a:1})}}
        }else if(Math.abs(o.x-BX)<28&&Math.abs(o.ry-(y-22))<36){
          score+=2;ding();pops.push({x:BX,y:y-60,txt:"+2",a:1});things.splice(i,1);continue;
        }
        if(o.x<-40)things.splice(i,1);
      }
      for(var j=pops.length-1;j>=0;j--){pops[j].y-=50*dt;pops[j].a-=1.4*dt;if(pops[j].a<=0)pops.splice(j,1)}
      if(lives<=0)return {score:score,pts:score};
      return null;
    },
    draw:function(c){
      c.fillStyle="#cdeffd";c.fillRect(0,0,W,H);
      c.fillStyle="#fff";
      [[60,110],[240,170],[150,70]].forEach(function(cl){
        var cx=((cl[0]-dist*0.2)%(W+120)+W+120)%(W+120)-60;
        ell(c,cx,cl[1],34,16);ell(c,cx+24,cl[1]-10,24,16);ell(c,cx-22,cl[1]-6,20,13);
      });
      c.fillStyle="#b7b0c9";c.fillRect(0,G+14,W,H-G-14);
      c.fillStyle="#8f88a8";c.fillRect(0,G+14,W,6);
      c.fillStyle="#fff";for(var lx=-((dist)%80);lx<W;lx+=80)c.fillRect(lx,G+62,40,6);
      things.forEach(function(o){if(o.kind==="plunger")drawPlunger(c,o.x,G+14);else drawRoll(c,o.x,o.ry)});
      if(!(safe>0&&Math.floor(t*12)%2)){
        c.fillStyle="#ff5fa2";c.fillRect(BX-26,y+4,52,6);
        c.fillStyle="#222";ell(c,BX-16,y+12,5,5);ell(c,BX+16,y+12,5,5);
        drawPoo(c,BX,y+6,44,"#7a4a22","shades",t);
      }
      c.font="800 24px 'Baloo 2',sans-serif";c.textAlign="center";
      pops.forEach(function(p){c.globalAlpha=Math.max(0,p.a);c.fillStyle=p.txt==="OUCH!"?"#e03131":"#ff5fa2";c.fillText(p.txt,p.x,p.y)});
      c.globalAlpha=1;
      hud(c,"Score: "+score,lives);
      if(t<2.5)banner(c,"Tap to jump!");
    }
  };
}

/* ---------- game 5: Dress-Up ---------- */
function DressGame(){
  var o=prof().outfit,t=0,party=-1,wig=0,conf=[],dance=-1,danceT=0,lastBeat=-1;
  var rows=[["hat",HATN],["eyes",EYEN],["extra",EXN],["color",COLN]];
  var DANCES=["Shuffle","Wiggle","Spin"],SOUNDS=["Toot","Drum","Honk","Squeak"];
  var TUNES=[[262,0,330,262,0,392,330,0],[523,587,523,587,659,587,523,494],[262,330,392,523,392,330,262,196]];
  var TEMPO=[0.2,0.15,0.18];
  function sound(i){
    if(i===0)fart();
    else if(i===1){tone("sine",150,45,0.2,0.4)}
    else if(i===2){tone("square",233,233,0.28,0.1);tone("square",277,277,0.28,0.1)}
    else tone("sine",1100,2300,0.13,0.18);
  }
  function button(c,x,y,w,h,fill,label){
    c.fillStyle=fill;c.fillRect(x,y,w,h);
    c.fillStyle="#fff";c.font="800 18px 'Baloo 2',sans-serif";c.textAlign="center";c.fillText(label,x+w/2,y+h/2+6);
  }
  return {
    name:"dress",
    pointer:noop,
    tap:function(x,y){
      if(party>=0)return;
      for(var i=0;i<4;i++){
        var ry=272+i*40;
        if(y>ry-19&&y<ry+19){var k=rows[i][0],n=rows[i][1].length;o[k]=(o[k]+(x<W/2?-1:1)+n)%n;fart();wig=0.3;save();return}
      }
      if(y>=420&&y<464){dance=Math.max(0,Math.min(2,Math.floor((x-20)/107)));danceT=0;lastBeat=-1;return}
      if(y>=466&&y<512){sound(Math.max(0,Math.min(3,Math.floor((x-20)/80))));wig=0.3;return}
      if(y>=516){dance=-1;party=0;tada();return}
      if(y<250){fart();wig=0.3}
    },
    update:function(dt){
      t+=dt;wig-=dt;
      if(dance>=0){
        danceT+=dt;
        var b=Math.floor(danceT/TEMPO[dance]);
        if(b!==lastBeat){
          lastBeat=b;var note=TUNES[dance][b%8];
          if(note)tone("square",note,note,0.14,0.07);
          if(b%2===0)tone("sine",110,50,0.1,0.25);
        }
        if(danceT>4.8)dance=-1;
      }
      if(party>=0){
        if(Math.floor(party/0.4)!==Math.floor((party+dt)/0.4))fart();
        party+=dt;confAdd(conf,Math.random()*W,-10,2,false);
        if(party>4.5)return {score:null,pts:5,title:"What a fancy poo!"};
      }
      confStep(conf,dt);
      return null;
    },
    draw:function(c){
      c.fillStyle=party>=0?"hsl("+Math.floor(party*200)%360+",90%,88%)":dance>=0?"hsl("+(40+dance*110)+",90%,90%)":"#fff0c9";
      c.fillRect(0,0,W,H);
      var bx=W/2,by=party>=0?330:238,d=danceT;
      c.save();
      if(party>=0){c.translate(bx,by-Math.abs(Math.sin(party*8))*34);c.rotate(Math.sin(party*8)*0.25)}
      else if(dance===0){c.translate(bx+Math.sin(d*5)*80,by);c.rotate(Math.sin(d*10)*0.14)}
      else if(dance===1){var w=Math.sin(d*16);c.translate(bx,by);c.rotate(w*0.3);c.scale(1+w*0.08,1-w*0.08)}
      else if(dance===2){c.translate(bx,by-Math.abs(Math.sin(d*6))*22);c.scale(Math.cos(d*6)||0.01,1)}
      else{c.translate(bx,by);if(wig>0)c.rotate(Math.sin(wig*40)*0.12)}
      drawPoo(c,0,0,party>=0?190:150,COLORS[o.color],outfitAcc(o),t);
      c.restore();
      if(party<0){
        rows.forEach(function(r,i){
          var ry=272+i*40;
          c.fillStyle="#fff";c.fillRect(20,ry-17,320,34);c.strokeStyle="#e3d3ad";c.lineWidth=3;c.strokeRect(20,ry-17,320,34);
          c.fillStyle="#ff5fa2";
          c.beginPath();c.moveTo(32,ry);c.lineTo(50,ry-11);c.lineTo(50,ry+11);c.closePath();c.fill();
          c.beginPath();c.moveTo(328,ry);c.lineTo(310,ry-11);c.lineTo(310,ry+11);c.closePath();c.fill();
          c.fillStyle="#3b2412";c.font="700 19px 'Baloo 2',sans-serif";c.textAlign="center";c.fillText(r[1][o[r[0]]],W/2,ry+7);
        });
        DANCES.forEach(function(n,i){button(c,20+i*107,424,100,38,dance===i?"#ff922b":"#19b5a5",n)});
        SOUNDS.forEach(function(n,i){button(c,20+i*80,470,74,38,"#ff5fa2",n)});
        button(c,70,520,220,46,"#8b5cf6","Party!");
      }
      confDraw(c,conf);
    }
  };
}

    var open=idx<p.hatched,a=open?accOf(q):"none";
    drawPoo(cv.getContext("2d"),100,208,has(a,"wings")?118:140,open?colOf(q):"#cbbfa3",a,0.1,!open);
    var lab=document.createElement("small");
    var rk=open?rankOf(q.game,p.best[q.game]):0;
    lab.textContent=open?(q.name+(rk?"\n"+"⭐".repeat(rk):"")):(idx===p.hatched?"Hatching next!":"Locked");
    b.appendChild(cv);b.appendChild(lab);
    b.addEventListener("click",function(){
      if(open){sel=q;fart()}else{bleh()}
      buildHome();
      room.children[idx].classList.add("wig");
    });
    room.appendChild(b);
  });
  $("cname").textContent=sel.name;
  $("cblurb").textContent=sel.blurb;
  var best=p.best[sel.game];
  var rank=rankOf(sel.game,best),lv=TITLES[sel.game];
  $("cbest").textContent=best?("Best score: "+best+(rank?" · "+RANKS[rank]:"")):"";
  $("ctitle").textContent=!lv?"":rank<3?("Score "+lv[rank]+" to become a "+RANKS[rank+1]+"!"):"Top title earned!";
  $("play").textContent="Play "+sel.gname;
}

/* ---------- game runner ---------- */
var cv=$("cv"),ctx=cv.getContext("2d"),game=null,raf=0,last=0,running=false;
function fit(){
  var k=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=Math.floor(W*k)+"px";cv.style.height=Math.floor(H*k)+"px";
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  if(game)game.draw(ctx);
}
window.addEventListener("resize",fit);
function px(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)*W/r.width}
function py(e){var r=cv.getBoundingClientRect();return (e.clientY-r.top)*H/r.height}
var GAMES={catch:CatchGame,flap:FlapGame,whack:WhackGame,run:RunGame,dress:DressGame,disco:DiscoGame};
cv.addEventListener("pointerdown",function(e){e.preventDefault();audio();if(game&&running)game.tap(px(e),py(e))});
cv.addEventListener("pointermove",function(e){if(game&&running)game.pointer(px(e))});
window.addEventListener("keydown",function(e){
  if(!game||!running)return;
  if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();game.tap(W/2)}
});

function start(kind){
  game=(GAMES[kind]||CatchGame)();
  $("over").classList.remove("on");show("game");fit();
  running=true;last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function loop(ts){
  if(!running)return;
  var dt=last?Math.min(0.033,(ts-last)/1000):0;last=ts;
  var res=game.update(dt);game.draw(ctx);
  if(res){finish(res);return}
  raf=requestAnimationFrame(loop);
}
function stop(){running=false;cancelAnimationFrame(raf)}
function finish(res){
  stop();
  var p=prof();
  p.pts+=res.pts;
  var newBest=res.score!=null&&res.score>(p.best[game.name]||0);
  var rank0=rankOf(game.name,p.best[game.name]);
  if(newBest)p.best[game.name]=res.score;
  var rank1=rankOf(game.name,p.best[game.name]);
  /* at most one new poo per game: the meter resets when one hatches */
  var hatched=null,next=POOS[p.hatched];
  if(next){p.meter+=res.pts;if(p.meter>=next.cost){p.hatched+=1;p.meter=0;hatched=next}}
  save();
  $("otitle").textContent=res.title||(rank1>rank0?"New title: "+RANKS[rank1]+"!":newBest&&res.score>0?"New best score!":"Party pooper!");
  $("oscore").textContent=res.score==null?"":res.score;
  $("opts").textContent="You earned ⭐ "+res.pts+" party points";
  $("hatch").textContent=hatched?("A new poo hatched: "+hatched.name+"!"):"";
  if(hatched){sel=hatched;tada()}else if(rank1>rank0)tada();
  $("over").classList.add("on");
}

$("play").addEventListener("click",function(){audio();start(sel.game)});
$("disco").addEventListener("click",function(){audio();start("disco")});
$("again").addEventListener("click",function(){start(game.name)});
$("back").addEventListener("click",function(){buildHome();show("home")});
$("quit").addEventListener("click",function(){stop();buildHome();show("home")});
$("switch").addEventListener("click",function(){buildWho();show("who")});
$("mute").addEventListener("click",function(){muted=!muted;this.textContent="Sound: "+(muted?"off":"on");if(!muted)fart()});

/* grown-up reset: hold the button for 3 seconds to wipe the current player's progress */
var resetBtn=$("reset"),holdT=0,labelT=0;
function resetLabel(txt){clearTimeout(labelT);resetBtn.textContent=txt;
  if(txt!=="Start over"&&txt!=="Keep holding...")labelT=setTimeout(function(){resetBtn.textContent="Start over"},1600)}
resetBtn.addEventListener("pointerdown",function(e){
  if(e&&e.preventDefault)e.preventDefault();
  resetLabel("Keep holding...");
  clearTimeout(holdT);
  holdT=setTimeout(function(){
    holdT=0;var p=prof();
    p.pts=0;p.best={};p.hatched=1;p.meter=0;p.outfit={hat:0,eyes:0,extra:0,color:0};
    save();sel=POOS[0];buildHome();bleh();resetLabel(me+" starts fresh!");
  },3000);
});
["pointerup","pointerleave","pointercancel"].forEach(function(ev){
  resetBtn.addEventListener(ev,function(){if(holdT){clearTimeout(holdT);holdT=0;resetLabel("Hold for 3 seconds")}});
});
resetBtn.addEventListener("contextmenu",function(e){e.preventDefault()});

buildWho();
})();
</script>
